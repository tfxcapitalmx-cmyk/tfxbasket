# Static site, no build step. Data files are refreshed by commits, so they must revalidate on every visit.
[build]
  publish = "."
  # Deploy only when the page itself changes (index.html, assets/, netlify.toml). Data, scripts, workflows and docs
  # do not change what the site serves (the page reads data/ from the repo; see index.html).
  # Each production deploy costs 15 Netlify credits. Exit code 0 = nothing served changed → Netlify cancels the build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html assets netlify.toml"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
