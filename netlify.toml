# The terminal moved to Cloudflare Pages on 2026-11-12 (docs/architecture.md → Hosting).
# Netlify must not build anymore: each production deploy costs credits. The Netlify sites linked to this repo
# (tfxmacrointelligence and tfxterminal) keep serving their last deploy, which reads data/ live from the repo.
# Delete this file only after disconnecting or deleting those Netlify sites; without it, every commit would deploy.
[build]
  publish = "."
  ignore = "exit 0"
