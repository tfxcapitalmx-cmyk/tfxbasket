# Averigua qué video está en vivo en cada canal de la sección TV y actualiza data/tv.json.
name: TV en vivo

on:
  schedule:
    - cron: '7,37 * * * *'   # cada 30 minutos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-tv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar los videos en vivo
        run: node scripts/tv/update.mjs
      - name: Publicar si cambió
        run: |
          if git diff --quiet -- data/tv.json; then echo "Sin cambios"; exit 0; fi
          git config user.name "tfx-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tv.json
          git commit -m "datos: TV en vivo"
          git pull --rebase
          git push
