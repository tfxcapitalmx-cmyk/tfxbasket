# Refreshes data/macro.json (Resumen + Cuantitativo) and data/charts.json (Gráficos) from FRED and data/manual.json.
name: Puntaje macro (FRED)

on:
  schedule:
    - cron: '45 13 * * 1-5'  # tras los datos de las 8:30 Nueva York (CPI, NFP, solicitudes, PPI)
    - cron: '30 22 * * 1-5'  # cierre: bonos, breakevens y Fed funds del día
  push:
    branches: [main]
    paths: ['data/manual.json', 'scripts/macro/**']  # al editar la captura manual o el código del proceso
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-macro
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar, calcular y validar
        run: node scripts/macro/update.mjs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Publicar si hay datos nuevos
        run: |
          if git diff --quiet -- data/macro.json data/charts.json; then echo "Sin cambios"; exit 0; fi
          git config user.name "tfx-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/macro.json data/charts.json
          git commit -m "datos: puntaje macro $(node -p "require('./data/macro.json').asof_iso")"
          git pull --rebase
          git push
