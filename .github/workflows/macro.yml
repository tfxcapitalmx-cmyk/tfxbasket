# Refreshes data/macro.json (Resumen + Cuantitativo), data/charts.json (Gráficos), data/dist.json (Distribución, datos macro)
# and data/calendar.json (Catalizador → agenda) from FRED, ForexFactory and data/manual.json.
name: Puntaje macro (FRED)

on:
  schedule:
    - cron: '45 13 * * 1-5'  # tras los datos de las 8:30 Nueva York (CPI, NFP, solicitudes, PPI)
    - cron: '30 22 * * 1-5'  # cierre: bonos, breakevens y Fed funds del día
  push:
    branches: [main]
    paths: ['data/manual.json', 'scripts/macro/**', 'scripts/calendar/**', 'scripts/nowcast/**']  # al editar la captura manual o el código del proceso
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-macro
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar, calcular y validar
        id: macro
        continue-on-error: true
        run: node scripts/macro/update.mjs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      # The agenda is independent: if the scorecard fails, the agenda still publishes (and vice versa).
      - name: Agenda del Catalizador
        id: agenda
        continue-on-error: true
        run: node scripts/calendar/update.mjs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      # The nowcast reads the agenda just built (release time and consensus of each figure).
      - name: Nowcast
        id: nowcast
        continue-on-error: true
        run: node scripts/nowcast/update.mjs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Publicar si hay datos nuevos
        run: |
          git add data/macro.json data/charts.json data/dist.json data/calendar.json data/nowcast.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git config user.name "tfx-data-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "datos: puntaje macro $(node -p "require('./data/macro.json').asof_iso")"
            git pull --rebase
            git push
          fi
      - name: Marcar fallo si algún paso falló
        if: steps.macro.outcome == 'failure' || steps.agenda.outcome == 'failure' || steps.nowcast.outcome == 'failure'
        run: |
          echo "Puntaje: ${{ steps.macro.outcome }} · Agenda: ${{ steps.agenda.outcome }} · Nowcast: ${{ steps.nowcast.outcome }}. Se publicó lo que sí se validó."
          exit 1
