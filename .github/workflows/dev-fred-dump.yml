# DEV ONLY (se borra al terminar): ensayo del proceso macro completo en la rama, sin publicar nada.
name: DEV ensayo proceso macro
on:
  push:
    branches: [datos/mercados-yahoo]
    paths: ['scripts/dev/**', '.github/workflows/dev-fred-dump.yml']
permissions:
  contents: read
jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Proceso macro completo (puntaje, gráficos, distribución)
        run: node scripts/macro/update.mjs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Proceso de mercados
        run: node scripts/markets/update.mjs
      - name: Qué se habría publicado
        run: git status --short && git diff --stat
