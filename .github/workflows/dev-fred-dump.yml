# DEV ONLY (se borra al terminar): descarga FRED a un artefacto privado de 1 día para reconstruir bonos, curva y tarjetas.
name: DEV descarga FRED
on:
  push:
    branches: [fase1/fiabilidad]
    paths: ['scripts/dev/**', '.github/workflows/dev-fred-dump.yml']
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/dev/fred-dump.mjs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: fred
          path: .cache/fred
          retention-days: 1
